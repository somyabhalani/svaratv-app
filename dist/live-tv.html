<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>svaratv</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Outfit:wght@300;400;500;600&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #F7F5F0; /* Cream background */
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: #2C2A26; /* Deep elegant charcoal */
            padding: 16px;
            gap: 16px;
        }

        /* Custom scrollbar - Luxury subtle */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E5E0D8; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4CDBC; }

        .active-channel {
            background-color: #F0EBE1;
            border-left: 4px solid #C5A880; /* Champagne Gold */
        }
    </style>
</head>
<body class="flex flex-col">

    <!-- Splash Screen -->
    <div id="splash-screen" class="fixed inset-0 z-50 bg-[#F7F5F0] flex flex-col items-center justify-center transition-opacity duration-1000">
        <video id="splash-video" src="splash.mp4" autoplay muted playsinline class="w-64 h-64 object-cover rounded-[2rem] shadow-2xl"></video>
        <h1 class="text-3xl tracking-[0.3em] text-[#2C2A26] mt-6" style="font-family: 'Outfit', sans-serif; font-weight: 300;">svaratv</h1>
    </div>

    <!-- Header / Nav -->
    <header class="w-full bg-white rounded-3xl shadow-sm p-5 flex justify-between items-center shrink-0 border border-[#EBE6DD]">
        <div class="flex items-center gap-4 pl-2">
            <h1 class="text-3xl tracking-[0.2em] text-[#2C2A26]" style="font-family: 'Outfit', sans-serif; font-weight: 400;">svaratv</h1>
        </div>
        <div class="text-sm text-[#8C857B] font-medium" id="status-text">Fetching channels...</div>
    </header>

    <!-- Main App Area -->
    <div class="flex flex-1 gap-4 overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-[340px] bg-white rounded-3xl shadow-sm border border-[#EBE6DD] flex flex-col shrink-0 overflow-hidden">
            <div class="p-5 border-b border-[#EBE6DD] flex flex-col gap-4 bg-white/50 backdrop-blur-md z-10">
                
                <!-- Highlighted FanCode Button -->
                <a href="index.html" class="w-full flex items-center gap-4 p-3 bg-gradient-to-r from-[#2C2A26] to-[#1A1916] hover:from-[#1A1916] hover:to-[#000000] rounded-2xl cursor-pointer transition shadow-lg group">
                    <div class="w-12 h-12 rounded-xl bg-white/10 border border-white/20 flex items-center justify-center text-2xl shadow-inner group-hover:scale-105 transition-transform">⭐</div>
                    <div class="flex-1">
                        <div class="text-sm font-bold text-white tracking-wide">FanCode Premium</div>
                        <div class="text-[10px] text-[#D4CDBC] font-semibold uppercase tracking-wider mt-0.5">Live Sports Events</div>
                    </div>
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" class="text-white opacity-80 mr-1"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                </a>
                
                <div class="relative">
                    <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-[#A39D93]" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35"></path></svg>
                    <input type="text" id="searchInput" placeholder="Search channels..." class="w-full pl-12 pr-4 py-3 bg-[#F7F5F0] border border-[#EBE6DD] rounded-2xl text-sm focus:outline-none focus:border-[#C5A880] focus:ring-2 focus:ring-[#C5A880]/20 transition text-[#2C2A26] placeholder-[#A39D93]">
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-3 flex flex-col gap-1" id="channelList">
                <!-- Channels injected here -->
            </div>
        </aside>

        <!-- Player Area -->
        <main class="flex-1 bg-black rounded-3xl shadow-xl overflow-hidden relative flex flex-col border border-[#EBE6DD]">
            <div class="absolute top-0 left-0 w-full p-6 bg-gradient-to-b from-black/80 to-transparent z-10 pointer-events-none">
                <h2 id="nowPlayingTitle" class="text-white text-2xl font-bold tracking-wide drop-shadow-md" style="font-family: 'Outfit', sans-serif;">Select a channel to play</h2>
            </div>
            <video id="video-player" controls autoplay class="w-full h-full object-contain bg-black"></video>
        </main>
    </div>

    <script>
        // Splash Screen Logic
        document.addEventListener("DOMContentLoaded", () => {
            const splashVideo = document.getElementById('splash-video');
            const splashScreen = document.getElementById('splash-screen');

            splashVideo.addEventListener('ended', () => {
                splashScreen.style.opacity = '0';
                setTimeout(() => {
                    splashScreen.remove();
                }, 1000); // Wait for the CSS transition to finish before removing from DOM
            });
            
            // Fallback just in case video fails to load or autoplay is blocked
            splashVideo.addEventListener('error', () => {
                splashScreen.remove();
            });
            setTimeout(() => {
                if (splashScreen) {
                    splashScreen.style.opacity = '0';
                    setTimeout(() => splashScreen.remove(), 1000);
                }
            }, 5000); // 5 second absolute maximum timeout
        });

        let hls = null;
        const video = document.getElementById('video-player');
        const channelListEl = document.getElementById('channelList');
        const searchInput = document.getElementById('searchInput');
        const nowPlayingTitle = document.getElementById('nowPlayingTitle');
        const statusText = document.getElementById('status-text');

        let allChannels = [];
        let activeItem = null;

        const M3U_URLS = [
            "https://raw.githubusercontent.com/ImLuke954/phoenix-iptv-india/main/india/index.m3u",
            "https://raw.githubusercontent.com/saeidsujon-rahman/BDIX-IPTV/main/IPTV%20Playlist.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/animation.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/auto.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/business.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/classic.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/comedy.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/cooking.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/culture.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/documentary.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/education.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/entertainment.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/family.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/general.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/interactive.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/kids.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/legislative.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/lifestyle.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/movies.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/music.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/news.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/outdoor.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/public.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/relax.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/religious.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/science.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/series.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/shop.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/sports.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/travel.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/undefined.m3u",
            "https://raw.githubusercontent.com/JOGINDHARR/iptv/main/categories/weather.m3u"
        ];

        async function fetchChannels() {
            try {
                statusText.textContent = "Fetching channels...";
                
                const fetchPromises = M3U_URLS.map(url => fetch(url).then(res => res.ok ? res.text() : "").catch(err => { console.error("Failed", url); return ""; }));
                const results = await Promise.all(fetchPromises);
                
                const m3uText = results.join("\\n");
                
                parseM3U(m3uText);
                statusText.textContent = `${allChannels.length} Channels loaded`;
                
                renderChannels(allChannels);
            } catch (error) {
                console.error(error);
                statusText.textContent = "Error loading channels";
                channelListEl.innerHTML = `<div class="p-4 text-center text-red-400 text-sm">Failed to fetch playlists. Please check your internet connection.</div>`;
            }
        }

        function parseM3U(text) {
            const lines = text.split('\n');
            let currentChannel = {};
            allChannels = [];

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {};
                    
                    // Parse name
                    const nameMatch = line.match(/tvg-name="([^"]+)"/);
                    if (nameMatch) {
                        currentChannel.name = nameMatch[1];
                    } else {
                        const altNameMatch = line.match(/,\s*(.+)$/);
                        currentChannel.name = altNameMatch ? altNameMatch[1].trim() : 'Unknown Channel';
                    }
                    
                    // Parse logo
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    if (logoMatch) currentChannel.logo = logoMatch[1];
                    
                    // Parse group
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    if (groupMatch) currentChannel.group = groupMatch[1];
                    else currentChannel.group = 'Uncategorized';
                    
                } else if (line && !line.startsWith('#') && line.startsWith('http')) {
                    if (currentChannel.name) {
                        currentChannel.url = line;
                        allChannels.push(currentChannel);
                        currentChannel = {};
                    }
                }
            }
        }

        function renderChannels(channels) {
            channelListEl.innerHTML = '';
            
            if (channels.length === 0) {
                channelListEl.innerHTML = `<div class="p-6 text-center text-[#8C857B] text-sm font-medium">No channels found.</div>`;
                return;
            }

            // --- PERFORMANCE FIX ---
            // Rendering 13,000+ DOM elements freezes the app. We only render the first 150.
            const MAX_RENDER = 150;
            const channelsToRender = channels.slice(0, MAX_RENDER);

            channelsToRender.forEach((channel, idx) => {
                const item = document.createElement('div');
                item.className = 'flex items-center gap-4 p-3 rounded-2xl cursor-pointer hover:bg-[#F0EBE1] transition mb-1 border-l-4 border-transparent group';
                
                const logoHtml = channel.logo 
                    ? `<img src="${channel.logo}" class="w-12 h-12 rounded-xl object-contain bg-white shadow-sm p-1 border border-[#EBE6DD]" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBmaWxsPSIjRjRGMUVCIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJzYW5zLXNlcmlmIiBmb250LXNpemU9IjEyIiBmaWxsPSIjOEM4NTdCIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5UVjwvdGV4dD48L3N2Zz4='">`
                    : `<div class="w-12 h-12 rounded-xl bg-white border border-[#EBE6DD] flex items-center justify-center text-xs font-bold text-[#8C857B] shadow-sm">TV</div>`;

                item.innerHTML = `
                    ${logoHtml}
                    <div class="flex-1 min-w-0">
                        <div class="text-[15px] font-semibold text-[#2C2A26] truncate group-hover:text-[#C5A880] transition-colors">${channel.name}</div>
                        <div class="text-xs text-[#8C857B] font-medium truncate mt-0.5">${channel.group}</div>
                    </div>
                `;

                item.onclick = () => {
                    if (activeItem) activeItem.classList.remove('active-channel');
                    item.classList.add('active-channel');
                    activeItem = item;
                    
                    nowPlayingTitle.textContent = channel.name;
                    playStream(channel.url);
                };

                channelListEl.appendChild(item);
            });

            // Show a message if there are hidden channels
            if (channels.length > MAX_RENDER) {
                const moreInfo = document.createElement('div');
                moreInfo.className = 'p-4 mt-2 text-center text-xs text-[#8C857B] font-semibold bg-[#F7F5F0] rounded-2xl border border-[#EBE6DD]';
                moreInfo.textContent = `+ ${channels.length - MAX_RENDER} more channels. Type to search.`;
                channelListEl.appendChild(moreInfo);
            }
        }

        function filterChannels() {
            const term = searchInput.value.toLowerCase();
            
            const filtered = allChannels.filter(c => {
                return (c.name && c.name.toLowerCase().includes(term)) || 
                       (c.group && c.group.toLowerCase().includes(term));
            });
            
            renderChannels(filtered);
        }

        searchInput.addEventListener('input', filterChannels);

        function playStream(url) {
            if (hls) hls.destroy();

            // Since this is Electron with webSecurity: false, CORS is not an issue
            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e=>console.log(e)));
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play().catch(e=>console.log(e));
            }
        }

        // Start Fetching on load
        fetchChannels();
    </script>
</body>
</html>
