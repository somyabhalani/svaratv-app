<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FanCode Player Native</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f0f0f; 
            margin: 0;
            overflow-x: hidden;
        }

        #ambient-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            /* Massive blur and saturation to create the glowing light effect */
            filter: blur(120px) saturate(250%) opacity(0.5);
            transform: scale(1.2); /* Prevents sharp unblurred edges near screen borders */
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .glass-panel {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        select option { background-color: #1e293b; color: white; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col text-white">
    <canvas id="ambient-canvas" width="64" height="36"></canvas>

    <header class="w-full flex flex-col justify-center items-center gap-2 mb-2 md:mb-4 mt-2">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 bg-black/5 backdrop-blur-md rounded-2xl border border-black/10 flex items-center justify-center shadow-sm p-2">
                <img src="https://www.google.com/s2/favicons?domain=fancode.com&sz=128" alt="Logo" class="w-full h-full object-contain rounded-lg shadow-sm">
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold text-[#e50020] drop-shadow-sm tracking-tighter">FanCode</h1>
        </div>
        <a href="live-tv.html" class="mt-2 px-6 py-2 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 backdrop-blur-md text-white font-bold transition-all shadow-lg flex items-center gap-2 text-sm">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
            Back to Dashboard
        </a>
    </header>

    <main class="flex-1 flex flex-col justify-start pt-0 items-center w-full max-w-4xl mx-auto pb-12">
        <div class="w-full flex flex-col glass-panel p-4 md:p-6 shadow-2xl">
            <div class="mb-4 px-2 flex justify-center items-center">
                <select id="channel-select" onchange="playSelectedStream()" class="bg-black/20 hover:bg-black/30 transition-colors text-white border border-white/20 rounded-xl px-4 py-2 font-bold backdrop-blur-md outline-none cursor-pointer w-full shadow-sm text-center">
                    <option value="">Loading streams...</option>
                </select>
            </div>
            
            <div class="w-full aspect-video bg-black/60 backdrop-blur-xl rounded-[1.5rem] overflow-hidden shadow-2xl relative flex items-center justify-center border border-white/10">
                <video id="video-player" controls autoplay class="w-full h-full outline-none object-contain"></video>
            </div>
        </div>
    </main>

    <script>
        let hls = null;
        const video = document.getElementById('video-player');
        const channelSelect = document.getElementById('channel-select');
        let channelsData = [];

        async function fetchFanCodePlaylist() {
            try {
                channelSelect.innerHTML = `<option value="">Downloading playlist...</option>`;
                const response = await fetch('https://raw.githubusercontent.com/drmlive/fancode-live-events/main/fancode.m3u');
                if (response.ok) {
                    const data = await response.text();
                    parseM3U(data);
                } else {
                    channelSelect.innerHTML = `<option value="">Failed to download playlist</option>`;
                }
            } catch (err) {
                console.error(err);
                channelSelect.innerHTML = `<option value="">Error fetching playlist</option>`;
            }
        }
        
        fetchFanCodePlaylist();

        function parseM3U(text) {
            const lines = text.split('\n');
            let currentName = 'Unknown Channel';
            channelsData = [];

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF')) {
                    const nameSplit = line.split(',');
                    if (nameSplit.length > 1) currentName = nameSplit[nameSplit.length - 1].trim();
                } 
                else if (line.startsWith('http')) {
                    channelsData.push({ name: currentName.replace(/'/g, "\\'"), url: line });
                    currentName = 'Unknown Channel';
                }
            }

            if (channelsData.length > 0) {
                channelSelect.innerHTML = channelsData.map((ch, idx) => 
                    `<option value="${idx}">▶ ${ch.name}</option>`
                ).join('');
                
                playStream(channelsData[0].url);
            } else {
                channelSelect.innerHTML = '<option value="">No streams available</option>';
            }
        }

        function playSelectedStream() {
            const selectedIdx = channelSelect.value;
            if(selectedIdx !== "") {
                playStream(channelsData[selectedIdx].url);
            }
        }

        function playStream(url) {
            if (hls) hls.destroy();

            if (Hls.isSupported()) {
                // No proxy needed anymore! webSecurity: false handles everything perfectly.
                hls = new Hls({});
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play();
            }
        }

        // --- AMBIENT MODE LOGIC ---
        const ambientCanvas = document.getElementById('ambient-canvas');
        const ambientCtx = ambientCanvas.getContext('2d');

        function renderAmbient() {
            if (!video.paused && !video.ended) {
                // Draw current video frame to our tiny hidden canvas (which CSS blurs immensely)
                ambientCtx.drawImage(video, 0, 0, ambientCanvas.width, ambientCanvas.height);
            }
            requestAnimationFrame(renderAmbient);
        }

        video.addEventListener('play', () => {
            requestAnimationFrame(renderAmbient);
        });
    </script>
</body>
</html>
